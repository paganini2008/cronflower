spring.application.name=cronsmith-executor
server.port=18080

# Point at the real cronsmith server.
#cronsmith.client.server-urls=http://localhost:19090
cronsmith.client.server-urls=http://localhost:7500/cs
cronsmith.client.register-interval-seconds=10
cronsmith.client.base-url=http://localhost:7500/ee

# Expose actuator health so the server picks /actuator/health as the liveness probe.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Split liveness/readiness groups: /actuator/health/liveness + /actuator/health/readiness (KONG / K8s probes).
management.endpoint.health.probes.enabled=true

logging.level.com.github.cronsmith=DEBUG
