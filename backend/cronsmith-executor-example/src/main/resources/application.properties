spring.application.name=cronsmith-executor
server.port=18080

# Point at the cronsmith scheduler (any node — the client fails over across a comma-separated list).
cronsmith.client.server-urls=http://localhost:19090
cronsmith.client.register-interval-seconds=10
# The URL the scheduler calls back is auto-detected from this executor's own host:port. Only set
# cronsmith.client.base-url / advertise-host / advertise-port if the executor sits behind a proxy.

# Expose actuator health so the server picks /actuator/health as the liveness probe.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Split liveness/readiness groups: /actuator/health/liveness + /actuator/health/readiness (K8s probes).
management.endpoint.health.probes.enabled=true

logging.level.com.github.cronsmith=DEBUG
