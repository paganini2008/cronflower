spring.application.name=cronsmith-scheduler
server.port=19090

# --- Storage: persistent embedded H2 file (zero external infra, survives restarts). ---
# Auto-detected as H2 (node-local). Point spring.datasource.url at MySQL/PostgreSQL to get a shared
# store, which also unlocks group sharding (cronsmith.server.scheduler.sharding=true).
spring.datasource.url=jdbc:h2:file:./data/cronsmith;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Cluster: single node by default (auto-forms). For multi-node set spring.spreader.ip-addresses. ---
spring.spreader.name=cronsmith-scheduler
spring.spreader.port=22000

# --- Scheduler ---
cronsmith.server.scheduler.zone=UTC
cronsmith.server.scheduler.window-minutes=5
cronsmith.server.scheduler.claim-interval-seconds=15

# --- Actuator: health/info/metrics for the System Health page and executor liveness probes. ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Split liveness/readiness groups: /actuator/health/liveness + /actuator/health/readiness (K8s probes).
management.endpoint.health.probes.enabled=true

# --- CORS for the cronflower frontend (origins configurable; defaults to any). ---
cronsmith.demo.cors-origins=*
# Actuator endpoints have their OWN CORS — the MVC CORS above does NOT cover /actuator, so without
# this the System Health page cannot read /actuator/health cross-origin. Mirror the same origins.
management.endpoints.web.cors.allowed-origin-patterns=${cronsmith.demo.cors-origins:*}
management.endpoints.web.cors.allowed-methods=GET

# --- Swagger UI / OpenAPI (springdoc). UI at /swagger-ui.html, spec at /v3/api-docs. These live at
#     the root, outside cronsmith.server.api-prefix (which only prefixes the ...scheduler.web
#     controllers), so they are reachable regardless of the business API prefix. ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

logging.level.com.github.cronsmith=INFO
logging.level.com.chaconneai=WARN
