# ============================================================================================
# Cronflow server — DEV environment (overrides only).
#
# Common, environment-agnostic config lives in application.properties. This file holds ONLY what DEV
# changes on top of it. It is used two independent ways:
#   - Local debug: loaded when the 'dev' Spring profile is active in the IDE.
#   - Packaging:   `mvn -Pdev` (default) emits it as the external conf/server.properties, which the
#                  deploy scripts layer on top of the jar's defaults.
# Per-node settings (server.port, cluster peers) are injected by the run scripts, not pinned here.
# ============================================================================================

# --- Datasource -----------------------------------------------------------------------------
# DEV uses the packaged embedded H2 (data files start with 'cronflow'); the run scripts inject a
# per-node H2 file so each node has its own store (the leader broadcasts writes to keep them in sync).
# Nothing to set for the H2 demo. For a SHARED dev database uncomment one block (never a single H2 file
# across nodes — store kind is auto-detected):
#   spring.datasource.url=jdbc:mysql://HOST:3306/cronflow?connectionTimeZone=UTC&preserveInstants=false
#   spring.datasource.username=cronflow
#   spring.datasource.password=cronflow
#   spring.datasource.url=jdbc:postgresql://HOST:5432/cronflow

# --- Logging: chattier for local development (common default is INFO) ------------------------
logging.level.com.github.cronsmith=DEBUG
logging.level.com.github.cronflow=DEBUG

# --- Security -------------------------------------------------------------------------------
# DEV uses the packaged dev secret and the seeded demo accounts (admin/admin123, scheduler_admin,
# workflow_admin, user). For a shared cluster set one random secret on every node and real accounts
# (the keys live in application.properties):
#   cronflow.security.jwt.secret=change-me-to-a-long-random-secret-shared-by-all-nodes
#   cronflow.security.users[0].username=admin
#   cronflow.security.users[0].password={bcrypt}$2a$10$....(bcrypt hash)
#   cronflow.security.users[0].roles=admin
