# ============================================================================================
# Cronflow server — PROD environment (overrides only).
#
# Common, environment-agnostic config lives in application.properties. This file holds ONLY what PROD
# changes on top of it. Used two independent ways: loaded when the 'prod' Spring profile is active
# (local debug), or emitted by `mvn -Pprod` as the external conf/server.properties.
# Nothing sensitive is baked into the jar; everything below is overridable by environment variable.
# ============================================================================================

# --- Datasource: shared MySQL (a shared DB also unlocks group sharding) -----------------------
# Point at your MySQL; switch url/driver to PostgreSQL if you prefer (both drivers are on the path).
spring.datasource.url=${CRONFLOW_DB_URL:jdbc:mysql://localhost:3306/cronflow?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${CRONFLOW_DB_USERNAME:root}
spring.datasource.password=${CRONFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool sized for a shared database under cluster load.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=cronflow-pool
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# (ddl-auto=update is inherited from application.properties. For a hardened deployment switch it to
# 'validate' here and manage schema with migrations out of band.)

# --- Scheduler: a shared DB enables group sharding across the cluster (CAS claim vs broadcast) -----
cronsmith.server.scheduler.sharding=true

# --- Security: bearer JWT secret is REQUIRED in prod (no default -> fail fast) ----------------
# Use a long random value, IDENTICAL on every node (any node then accepts a token minted by any other).
cronflow.security.jwt.secret=${CRONFLOW_JWT_SECRET}
# Override the demo accounts with real ones (roles: admin / scheduler_admin / workflow_admin / user):
#   cronflow.security.users[0].username=admin
#   cronflow.security.users[0].password={bcrypt}$2a$10$....(bcrypt hash)
#   cronflow.security.users[0].roles=admin
