spring.application.name=cronflow-server

# This file is the COMMON, environment-agnostic defaults and is the ONLY properties file baked into the
# jar. Two independent mechanisms handle environments:
#   - Local debug: application-dev.properties / application-prod.properties sit in src/main/resources
#     (NOT packaged) and are loaded by activating a Spring profile in the IDE.
#   - Packaging: `mvn -Pdev` (default) / `mvn -Pprod` emits the chosen application-<env>.properties as
#     the external conf/server.properties, layered on top at runtime by the deploy scripts.
# The H2 default below just keeps a bare `java -jar` runnable out of the box; server.properties (or the
# run scripts) overrides it.

# Local-debug default port; the deploy runners hand every node a random port instead.
server.port=19090

# --- Storage: embedded H2 file default (data files start with 'cronflow'). Override via server.properties
#     (prod = MySQL/PostgreSQL) or the run scripts (per-node H2 file). Store kind is auto-detected. ---
spring.datasource.url=jdbc:h2:file:./data/cronflow;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Cluster: single node by default (auto-forms). For multi-node set spring.spreader.ip-addresses.
#     Note: executors are independent clients over HTTP, not members of this cluster. ---
spring.spreader.name=cronflow-server
spring.spreader.port=22000

# NOTE: the openspreader DAG engine (spring.spreader.multiprocessing.pooling/dag.enabled) is turned on
# automatically by the cronflow starter (see CronflowEngineDefaults) - no need to set it here. Set
# either to false to override.

# --- Scheduler ---
cronsmith.server.scheduler.zone=UTC
cronsmith.server.scheduler.window-minutes=5
cronsmith.server.scheduler.claim-interval-seconds=15

# --- Actuator: health/info/metrics for the System page and executor liveness probes. show-details is
#     'always' on purpose: the console load balancer discovers the cluster from an UNAUTHENTICATED
#     /actuator/health (it reads spreaderCluster.details), so the details must be visible without a
#     token. Everything under /actuator beyond health/info is locked to ADMIN by SecurityConfig. ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# Prometheus scrape endpoint for Grafana at /actuator/prometheus (left public in SecurityConfig so a
# scraper can pull it without a user token).
management.prometheus.metrics.export.enabled=true
# Split liveness/readiness groups: /actuator/health/liveness + /actuator/health/readiness (K8s probes).
management.endpoint.health.probes.enabled=true

# --- CORS for the Cronflow console. Single knob: both the business-API CORS (SecurityConfig's
#     CorsConfigurationSource) and the actuator CORS below read cronflow.server.cors-origins. Its value
#     equals the built-in fallback, so it only matters when you narrow it to specific origins. ---
cronflow.server.cors-origins=*
# Actuator endpoints have their OWN CORS (separate from the business-API CORS), needed so the System
# page can read /actuator/health cross-origin. Mirror the same origins.
management.endpoints.web.cors.allowed-origin-patterns=${cronflow.server.cors-origins:*}
management.endpoints.web.cors.allowed-methods=GET

# --- Swagger UI / OpenAPI (springdoc). UI at /swagger-ui.html, spec at /v3/api-docs. These live at
#     the root, outside the cronsmith / cronflow api-prefix, so they are reachable regardless of the
#     business API prefix. Sign in via POST /auth/login first. ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Security: login + role based authorization (see SecurityConfig). ---
# Set cronflow.security.enabled=false to leave the whole API open (dev only).
# Bearer JWT: the signing secret MUST be the same on every node (any node accepts any node's token) and
# MUST be overridden in production - the dev default below is not a secret. See application-prod.
cronflow.security.jwt.secret=cronflow-dev-secret-change-me-please-0123456789abcdef
cronflow.security.jwt.ttl-minutes=720
# Accounts: Cronflower has NO self-registration - users are provisioned in an XML store. This points at
# the packaged classpath:users.xml (dev demo accounts); override it with an external file for a real
# deployment (no rebuild): cronflow.security.users-file=file:/opt/cronflow/conf/users.xml
cronflow.security.users-file=classpath:users.xml

logging.level.com.github.cronsmith=INFO
logging.level.com.github.cronflow=INFO
logging.level.com.chaconneai=WARN
