# ============================================================================================
# cronsmith scheduler — externalised advanced configuration.
#
# The runnable jar already ships best-practice defaults (see the packaged application.properties
# in cronsmith-scheduler-example). This file is layered ON TOP of those defaults so you can tune a
# running deployment WITHOUT rebuilding: the launch scripts pass it via
#   --spring.config.additional-location=file:<deploy>/conf/scheduler.properties
# and any key set here wins over the packaged default.
#
# Per-node settings the scripts must own — server.port and the cluster peers — are injected on the
# command line by run-local.sh / run-docker.sh and should NOT be pinned here, or multi-node runs
# would collide. Everything else is safe to tune by hand.
# ============================================================================================

# --- Datasource -----------------------------------------------------------------------------
# Out of the box each node uses its OWN embedded H2 file (the run scripts inject a per-node URL); the
# leader broadcasts writes so every node keeps its copy in sync. You do NOT need to touch anything for
# the default demo. Setting a datasource here OVERRIDES that for ALL nodes, so only put a *shared*
# networked database here (MySQL/PostgreSQL) — never a single H2 file, which multiple nodes cannot
# safely share. The store kind is auto-detected (MySQL/PostgreSQL → shared + sharding-capable).
#
# MySQL (shared store — enables multi-node sharding; reachable from containers too):
#   spring.datasource.url=jdbc:mysql://HOST:3306/cronsmith?connectionTimeZone=UTC&preserveInstants=false
#   spring.datasource.username=cronsmith
#   spring.datasource.password=cronsmith
#
# PostgreSQL:
#   spring.datasource.url=jdbc:postgresql://HOST:5432/cronsmith
#   spring.datasource.username=cronsmith
#   spring.datasource.password=cronsmith

# --- Scheduler engine -----------------------------------------------------------------------
# Fire-time zone. MUST be identical on every node of a cluster.
cronsmith.server.scheduler.zone=UTC
# Windowed loading: only tasks due within this many minutes are held in memory.
cronsmith.server.scheduler.window-minutes=5
# How often the leader claims due tasks.
cronsmith.server.scheduler.claim-interval-seconds=15
# Group sharding — only effective over a SHARED store (MySQL/PostgreSQL), ignored on H2/in-memory.
# The scripts turn this on automatically for a multi-node MySQL cluster.
# cronsmith.server.scheduler.sharding=false

# --- Persistence tuning ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Actuator (System Health page + executor liveness) --------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- CORS for the cronflower console (comma-separated origin patterns; * = any) --------------
cronsmith.demo.cors-origins=*
# Actuator endpoints have their OWN CORS — the MVC CORS above does NOT cover /actuator, so without
# this the System Health page cannot read /actuator/health cross-origin. Mirror the same origins.
management.endpoints.web.cors.allowed-origin-patterns=${cronsmith.demo.cors-origins:*}
management.endpoints.web.cors.allowed-methods=GET

# --- Logging --------------------------------------------------------------------------------
logging.level.com.github.cronsmith=INFO
logging.level.com.chaconneai=WARN
