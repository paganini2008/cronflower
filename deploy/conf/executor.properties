# ============================================================================================
# cronsmith executor — externalised advanced configuration.
#
# The runnable jar already ships best-practice defaults (see the packaged application.properties in
# cronsmith-executor-example). This file is layered ON TOP of those defaults so you can tune running
# executors WITHOUT rebuilding: the launch scripts pass it via
#   run-local.sh : --spring.config.additional-location=file:<deploy>/conf/executor.properties
#   run-docker.sh: mounted at /config/executor.properties + SPRING_CONFIG_ADDITIONAL_LOCATION
# and any key set here wins over the packaged default.
#
# Per-executor settings the scripts must own are injected on the command line / via
# SPRING_APPLICATION_JSON and OUTRANK this file, so do NOT pin them here:
#   server.port                          (random 50000-60000 per executor)
#   spring.application.name              (demo-executor — SHARED by every executor instance so the
#                                         scheduler round-robins across them; instances are told
#                                         apart by the scheduler-minted instanceId, not the name)
#   cronsmith.client.server-urls         (all scheduler nodes, for fail-over)
#   cronsmith.client.server-api-prefix   (mirrors the scheduler's cronsmith.server.api-prefix)
# Everything below is safe to tune by hand.
# ============================================================================================
cronsmith.client.server-urls=http://localhost:19090


# --- Registration / heartbeat ---------------------------------------------------------------
# How often the executor re-registers (doubles as the heartbeat). Lower = reappears faster after a
# server restart / leader change; higher = less chatter.
cronsmith.client.register-interval-seconds=10
# Routing weight for the scheduler's WEIGHTED dispatch strategy (higher = more runs).
# cronsmith.client.weight=1

# --- Dispatch callbacks (server -> this executor) -------------------------------------------
# The scheduler dispatches to the URL this executor advertises. Auto-detection covers most cases;
# set these only when the scheduler reaches the executor on a different host/IP (containers -> host,
# NAT, a reverse proxy). base-url overrides scheme/host/port/path wholesale.
# cronsmith.client.base-url=http://HOST:PORT
# cronsmith.client.advertise-host=HOST
# cronsmith.client.advertise-port=PORT
#
# No gateway is required — the scheduler cluster and the web console load-balance on their own.
# If you still want to front things with nginx / KONG / Envoy (TLS, NAT, a single ingress), see
# "Running behind nginx / KONG" in docs/configuration.md; load balancing stays the scheduler's job,
# the gateway is only transparent transport.

# --- HTTP timeouts / execution pool ---------------------------------------------------------
# cronsmith.client.connect-timeout-millis=3000
# cronsmith.client.read-timeout-millis=10000
# Threads that run @Task method bodies.
# cronsmith.client.invoker-pool-size=8

# --- Actuator (liveness probe the scheduler health-checks) ----------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# Split liveness/readiness groups: /actuator/health/liveness + /actuator/health/readiness (K8s probes).
management.endpoint.health.probes.enabled=true

# --- Logging --------------------------------------------------------------------------------
logging.level.com.github.cronsmith=INFO
