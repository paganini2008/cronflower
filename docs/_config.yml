title: cronflower
description: A distributed DAG workflow platform for the JVM. Author workflows from beans, scripts or HTTP nodes, generate them with AI, and run them across a self-forming cluster, with a web console.

# Project site served at https://paganini2008.github.io/cronflower/ — baseurl must be the repo name so
# the `relative_url` filter builds correct links and image paths.
url: https://paganini2008.github.io
baseurl: /cronflower

# The site is English-only. The Chinese blog versions stay in the repo but are kept out of the build,
# so they never appear on GitHub Pages.
exclude:
  - blogger/cronflower/dag-workflow-orchestration.zh.md
  - blogger/cronflow/scheduler/distributed-task-scheduling.zh.md
  # Medium-paste variants (tables rewritten as lists) — not part of the site.
  - blogger/cronflower/dag-workflow-orchestration.en.medium.md
  - blogger/cronflow/scheduler/distributed-task-scheduling.en.medium.md
  - images/README.md
  - video/README.md
  - .DS_Store

# Every page uses the one custom layout (which loads Mermaid and styles the docs). Individual pages
# only need front matter with a title; the layout is applied here.
defaults:
  - scope:
      path: ""
    values:
      layout: default
