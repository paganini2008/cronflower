<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #2563eb; --ink: #0f2c4d; --muted: #3d5372; --line: #e6edf6;
      --bg: #f6f9fd; --code-bg: #f2f6fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.65;
    }
    header.site {
      position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 3px rgba(15, 44, 77, 0.05);
    }
    header.site .inner {
      max-width: 860px; margin: 0 auto; padding: 0.7rem 1.25rem;
      display: flex; align-items: center; gap: 1.25rem;
    }
    header.site .brand { font-weight: 700; color: var(--blue); text-decoration: none; font-size: 1.05rem; letter-spacing: -0.01em; }
    header.site nav { display: flex; gap: 1rem; flex-wrap: wrap; }
    header.site nav a { color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    header.site nav a:hover { color: var(--blue); }
    main {
      max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 4rem;
      background: transparent;
    }
    main h1, main h2, main h3 { line-height: 1.25; letter-spacing: -0.015em; margin-top: 2rem; }
    main h1 { font-size: 2rem; margin-top: 0.5rem; }
    main h2 { font-size: 1.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); }
    main h3 { font-size: 1.12rem; }
    main a { color: var(--blue); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
    main table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.92rem; display: block; overflow-x: auto; }
    main th, main td { border: 1px solid var(--line); padding: 0.5rem 0.7rem; text-align: left; vertical-align: top; }
    main th { background: #eef4fd; color: #2a4a72; }
    main code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em;
      background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 5px; }
    main pre { background: #0d1524; color: #e6edf9; padding: 1rem 1.1rem; border-radius: 12px; overflow-x: auto; }
    main pre code { background: none; padding: 0; color: inherit; font-size: 0.85rem; line-height: 1.55; }
    main blockquote { margin: 1rem 0; padding: 0.6rem 1rem; border-left: 3px solid var(--blue);
      background: #eef4fd; border-radius: 0 8px 8px 0; color: var(--muted); }
    main blockquote p { margin: 0.3rem 0; }
    .mermaid { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin: 1.25rem 0; text-align: center; }
    footer.site { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); }
    footer.site a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <header class="site">
    <div class="inner">
      <a class="brand" href="{{ '/' | relative_url }}">cronflower</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/architecture.html' | relative_url }}">Architecture</a>
        <a href="{{ '/developer-guide.html' | relative_url }}">Developer</a>
        <a href="{{ '/configuration.html' | relative_url }}">Configuration</a>
        <a href="https://github.com/paganini2008/cronflower">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site">
    cronflower = cronsmith (distributed scheduling) + cronflow (DAG orchestration) ·
    <a href="https://github.com/paganini2008/cronflower">source on GitHub</a>
  </footer>

  <!-- Render ```mermaid fenced blocks (kramdown wraps them in .language-mermaid) as diagrams. -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('.language-mermaid').forEach((block) => {
      const code = block.querySelector('code') || block;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      block.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    await mermaid.run({ querySelector: '.mermaid' });
  </script>
</body>
</html>
